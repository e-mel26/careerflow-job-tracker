<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CareerFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        
        <!-- Logo -->
        <div class="logo">
            <a href="/">CareerFlow</a>
        </div>

        <!-- Navigation Links -->
        <div class="nav-links">

            {% if current_user.is_authenticated %}
                <a href="/">Home</a>
                <a href="/add">Add Job</a>
                <span class="username">Hi, {{ current_user.username }}</span>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% endif %}

        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
