{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Your Jobs ({{ jobs|length }})</h2>

    <!-- ========================= -->
    <!-- Dashboard Stats -->
    <!-- ========================= -->
    <div class="stats">
        <div class="stat-box">
            <h3>Total</h3>
            <p>{{ total }}</p>
        </div>

        <div class="stat-box applied-box">
            <h3>Applied</h3>
            <p>{{ applied_count }}</p>
        </div>

        <div class="stat-box interview-box">
            <h3>Interview</h3>
            <p>{{ interview_count }}</p>
        </div>

        <div class="stat-box rejected-box">
            <h3>Rejected</h3>
            <p>{{ rejected_count }}</p>
        </div>
    </div>

    <!-- ========================= -->
    <!-- Chart -->
    <!-- ========================= -->
    <div style="max-width: 500px; margin: 40px auto;">
        <canvas id="statusChart"></canvas>
    </div>

    <!-- ========================= -->
    <!-- Search Form -->
    <!-- ========================= -->
    <form method="GET">
        <input type="text" name="search" placeholder="Search by company...">
        <button type="submit">Search</button>
    </form>

    <!-- ========================= -->
    <!-- Job Cards -->
    <!-- ========================= -->
    {% for job in jobs %}
    <div class="job-card">
        <h3>{{ job[1] }}</h3>
        <p>{{ job[2] }}</p>

        <span class="status {{ job[3]|lower }}">
            {{ job[3] }}
        </span>

        <div class="actions">
            <a class="delete-btn"
               href="/delete/{{ job[0] }}"
               onclick="return confirm('Are you sure you want to delete this job?');">
               Delete
            </a>

            <a class="edit-btn" href="/edit/{{ job[0] }}">
                Edit
            </a>
        </div>
    </div>
    {% endfor %}

</div>

<!-- ========================= -->
<!-- Chart.js Script -->
<!-- ========================= -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('statusChart');

new Chart(ctx, {
    type: 'pie',
    data: {
        labels: ['Applied', 'Interview', 'Rejected'],
        datasets: [{
            data: [{{ applied_count }}, {{ interview_count }}, {{ rejected_count }}],
            backgroundColor: [
                '#3b82f6',
                '#facc15',
                '#ef4444'
            ]
        }]
    },
    options: {
        plugins: {
            legend: {
                labels: {
                    color: '#ffffff'
                }
            }
        }
    }
});
</script>

{% endblock %}
